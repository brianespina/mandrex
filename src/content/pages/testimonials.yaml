  - discriminant: featuredTestimonial
    value:
      sectionId: featured
      quote: >-
        We've had the pleasure of working with Nikka and her incredible team for
        quite some time now, and they never cease to amaze us! The quality of
        work they consistently deliver is outstanding. From the first project to
        the most recent, their attention to detail and dedication to excellence
        have always shone through.  Communication is key, and Nikka truly excels
        in this department. Her prompt and clear updates keep us in the loop
        every step of the way. It's a genuine relief to know that we can rely on
        her agency for transparent and effective communication.  Flexibility is
        another one of Nikka's strengths. She and her team are always willing to
        go the extra mile to accommodate our needs. Their adaptability in
        handling changes and unexpected situations has been a weight off our
        shoulders.  If you're looking for a team that consistently delivers
        top-notch quality, Nikka and her team are the ones to choose. We
        couldn't be happier with the results they've provided us, and we look
        forward to many more successful projects together!  Highly recommended!
        👏👏👏
      authorInitials: JC
      authorName: Julianna Cianciola
      authorRole: Real estate group, Texas · sample testimonial
      stats:
