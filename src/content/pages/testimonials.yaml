        work they consistently deliver is outstanding. From the first project to
        the most recent, their attention to detail and dedication to excellence
        have always shone through.
      authorPhoto: /assets/testimonials/sections/1/value/authorPhoto.png
      authorInitials: JC
      authorName: Julianna Cianciola
      authorRole: Google review
      stats:
        - value: 1 day
          label: Average first response to inquiries
        - value: Long-term
          label: Client relationships built on accuracy and trust
