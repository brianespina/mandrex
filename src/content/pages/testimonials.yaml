    value:
      sectionId: inner-hero
      backgroundImage: /assets/testimonials/sections/0/value/backgroundImage.webp
      backgroundPosition: 50% 50%
      eyebrow: Testimonials
      headline: What working with Mandrex looks like
      lead: >-
        Reviews from clients on Google and Upwork, covering bookkeeping,
        accounts receivable, administrative and ongoing support.
      breadcrumb: {}
      buttons: []
      chips: []
