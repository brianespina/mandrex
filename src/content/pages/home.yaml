title: Mandrex VA Services — Virtual Assistance, Bookkeeping & Back-Office Support
description: >-
  Dependable virtual assistance, bookkeeping, administrative and customer
  support — back-office solutions so you can focus on growing your business.
sections:
  - discriminant: hero
    value:
      sectionId: hero
      backgroundImage: /assets/home/sections/0/value/backgroundImage.jpg
      backgroundPosition: 58% 55%
      eyebrow: Mandrex VA Services
      headline: Helping businesses stay organized, productive, and ready to grow
      lead: >-
        Virtual assistance, bookkeeping, administrative and customer support —
        dependable back-office solutions so you can focus on growing your
        business.
      primaryButton:
        label: Book a discovery call
        href: /contact
        variant: yellow
      secondaryButton:
        label: See services
        href: /services
        variant: outline-light
      stats:
        - value: 69+
          label: Businesses served
          accent: false
        - value: '13'
          label: Specialists
          accent: false
        - value: '4'
          label: Countries
          accent: false
        - value: 1 day
          label: Average reply time
          accent: true
  - discriminant: serviceGrid
    value:
      sectionId: services
      eyebrow: What we do
      title: Four service lines. One accountable team.
      showAllButton:
        label: All services
        href: /services
        variant: outline-dark
  - discriminant: whyChooseUs
    value:
      sectionId: why-us
      eyebrow: Why choose us
      title: Standards, not shortcuts
      intro: >-
        Outsourcing is about more than delegating tasks — it is trusting someone
        with an important part of your business. Every engagement is built
        around quality, accountability, and long-term partnership.
      tiles:
        - icon: shield
          title: Reliable
          description: >-
            Consistent support you can count on — the same standard of work,
            every week.
        - icon: target
          title: Accurate
          description: >-
            Detail-oriented work delivered with precision, reviewed before it
            reaches you.
        - icon: chart
          title: Scalable
          description: >-
            Flexible part-time or full-time solutions that grow alongside your
            business.
  - discriminant: industriesGrid
    value:
      sectionId: industries
      eyebrow: Industries
      title: Sectors we know inside out
      description: >-
        Startups to established companies — with workflows and tooling we adapt
        to yours. Hover any sector for detail.
      ctaTitle: Not listed?
      ctaDescription: Tell us what your operations need →
      ctaHref: /contact
  - discriminant: globalReach
    value:
      sectionId: global-reach
      locations:
        - country: United States of America
          label: United States
        - country: Canada
          label: Canada
        - country: United Kingdom
          label: United Kingdom
        - country: Australia
          label: Australia
      eyebrow: Global reach
      title: Four countries. One standard.
      description: >-
        We support businesses in the United States, Australia, Canada, and the
        United Kingdom — including Arizona, California, Texas, New Jersey, New
        York, Massachusetts, Florida, Colorado, Connecticut, Maryland,
        Mississippi, Missouri, Oklahoma, Oregon, and South Carolina.
      stats:
        - value: 15+
          label: U.S. states served
        - value: '3'
          label: Time-zone coverage windows
  - discriminant: testimonialFeature
    value:
      sectionId: testimonial-feature
      quote: >-
        Our books were three months behind. Within the first cycle Mandrex had
        everything reconciled — we now get a clean monthly report we actually
        use.
      authorInitials: OD
      authorName: Operations Director
      authorRole: Real estate group, Texas · sample testimonial
      heading: What clients say matters most
      checks:
        - Deadlines met without follow-up reminders
        - Clear documentation of how work gets done
        - One point of contact who knows the account
      button:
        label: Read client stories
        href: /testimonials
        variant: dark
  - discriminant: ctaBand
    value:
      sectionId: closing-cta
      variant: dark
      heading: Let's build your back office
      paragraph: >-
        Tell us where your operations are stretched. We'll reply within one
        business day with a recommended scope.
      button:
        label: Get started today
        href: /contact
        variant: yellow
